# /etc/nginx/sites-available/thenext-api
# Replace api.example.com with your API domain, then run
#   sudo certbot --nginx -d api.example.com
# which adds the HTTPS (443) server block and the http->https redirect here.

upstream thenext_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Flask allows 8 MB image uploads (MAX_CONTENT_LENGTH); nginx's default is 1 MB.
    client_max_body_size 10m;

    access_log /var/log/nginx/thenext-api.access.log;
    error_log  /var/log/nginx/thenext-api.error.log;

    location / {
        proxy_pass http://thenext_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}
